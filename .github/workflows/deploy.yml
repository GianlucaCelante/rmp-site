name: Deploy su GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # storia completa: il build ricava lastmod della sitemap dai commit

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build/package-lock.json

      - name: Build (minifica e unisce i CSS, copia solo il sito in dist/)
        working-directory: build
        run: |
          npm ci
          npm run build

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
